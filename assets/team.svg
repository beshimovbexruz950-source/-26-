<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182b" />
      <stop offset="100%" stop-color="#122a47" />
    </linearGradient>
    <linearGradient id="goldG3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#edd79e" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#teamGrad)" />
  
  <!-- Collaborative Team Icons Silhouette -->
  <g transform="translate(400, 260)">
    <!-- Central Leader -->
    <circle cx="0" cy="-60" r="28" fill="#1b365d" stroke="url(#goldG3)" stroke-width="2.5" />
    <path d="M -45 20 C -45 -25, 45 -25, 45 20 Z" fill="#1b365d" stroke="url(#goldG3)" stroke-width="2" />
    
    <!-- Left Member -->
    <circle cx="-90" cy="-35" r="22" fill="#142c4b" stroke="url(#goldG3)" stroke-width="1.5" />
    <path d="M -125 35 C -125 0, -55 0, -55 35 Z" fill="#142c4b" stroke="url(#goldG3)" stroke-width="1.5" />
    
    <!-- Right Member -->
    <circle cx="90" cy="-35" r="22" fill="#142c4b" stroke="url(#goldG3)" stroke-width="1.5" />
    <path d="M 55 35 C 55 0, 125 0, 125 35 Z" fill="#142c4b" stroke="url(#goldG3)" stroke-width="1.5" />
  </g>

  <text x="400" y="460" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="3">TEAM OF 35 PROFESSIONALS</text>
  <text x="400" y="495" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#edd79e" letter-spacing="2">CARING LEADERSHIP &amp; UNITED PURPOSE</text>
</svg>
