<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172c" />
      <stop offset="100%" stop-color="#0f2b4c" />
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfc27a" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#medGrad)" />
  
  <!-- Subtle Grid Lines -->
  <path d="M 0 150 H 800 M 0 300 H 800 M 0 450 H 800" stroke="#1d4068" stroke-width="1" opacity="0.4" />
  <path d="M 200 0 V 600 M 400 0 V 600 M 600 0 V 600" stroke="#1d4068" stroke-width="1" opacity="0.4" />
  
  <!-- Pulse / ECG Wave -->
  <path d="M 50 300 L 220 300 L 250 210 L 280 380 L 310 260 L 330 330 L 350 300 L 480 300 L 510 180 L 550 430 L 590 240 L 620 340 L 640 300 L 750 300" 
        fill="none" stroke="url(#goldG)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Heart Icon Center Emblem -->
  <g transform="translate(400, 240) scale(1.5)">
    <circle cx="0" cy="0" r="36" fill="#081b33" stroke="url(#goldG)" stroke-width="2" />
    <path d="M 0 16 C -18 2, -26 -16, -12 -24 C 0 -28, 0 -12, 0 -12 C 0 -12, 0 -28, 12 -24 C 26 -16, 18 2, 0 16 Z" fill="url(#goldG)" transform="translate(0, 4)" />
  </g>
  
  <text x="400" y="490" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" fill="#f8fafc" letter-spacing="4">CARDIAC SURGERY SUPPLIES</text>
  <text x="400" y="525" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#dfc27a" letter-spacing="2">PIONEERING CARDIOVASCULAR INNOVATION</text>
</svg>
