<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bukharaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081729" />
      <stop offset="100%" stop-color="#152e4f" />
    </linearGradient>
    <linearGradient id="goldG4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfc27a" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bukharaGrad)" />
  
  <!-- Architectural Arch Silhouette of Bukhara -->
  <g stroke="url(#goldG4)" stroke-width="2" fill="none" opacity="0.85">
    <!-- Outer Arch -->
    <path d="M 280 440 V 220 C 280 140, 520 140, 520 220 V 440" />
    <!-- Inner Arch -->
    <path d="M 320 440 V 240 C 320 180, 480 180, 480 240 V 440" />
    <!-- Minaret / Geometric Tower lines -->
    <path d="M 210 440 L 225 150 L 245 150 L 260 440" />
    <path d="M 540 440 L 555 150 L 575 150 L 590 440" />
  </g>
  
  <!-- Star Ornament -->
  <polygon points="400,205 408,225 430,225 412,238 418,258 400,245 382,258 388,238 370,225 392,225" fill="url(#goldG4)" />

  <text x="400" y="490" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="3">PESHKO‘ DISTRICT, BUKHARA</text>
  <text x="400" y="525" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#dfc27a" letter-spacing="2">ROOTS, HERITAGE &amp; ENDURING VALUES</text>
</svg>
