<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pharmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b30" />
      <stop offset="100%" stop-color="#142c4b" />
    </linearGradient>
    <linearGradient id="goldG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#edd79e" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pharmaGrad)" />
  
  <!-- Modern Geometric Molecular Pattern -->
  <g stroke="url(#goldG2)" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <polygon points="400,140 470,180 470,260 400,300 330,260 330,180" />
    <polygon points="540,220 610,260 610,340 540,380 470,340 470,260" />
    <polygon points="260,220 330,260 330,340 260,380 190,340 190,260" />
  </g>
  
  <!-- Capsule / Cross Emblem -->
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="50" fill="#0c1f38" stroke="url(#goldG2)" stroke-width="2.5" />
    <path d="M -16 -6 H 16 M 0 -22 V 10" stroke="url(#goldG2)" stroke-width="5" stroke-linecap="round" />
  </g>

  <text x="400" y="470" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="3">JASMINA ULUG‘BEK FARM</text>
  <text x="400" y="505" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#edd79e" letter-spacing="2">PHARMACEUTICAL DISTRIBUTION &amp; HEALTHCARE</text>
</svg>
